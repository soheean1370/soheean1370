<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5EE"/>
      <stop offset="0.55" stop-color="#FCEAF1"/>
      <stop offset="1" stop-color="#EEEAFB"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="card"><rect width="900" height="280" rx="36"/></clipPath>
    <path id="heart" d="M0 3 C0 -1 5 -1 5 3 C5 -1 10 -1 10 3 C10 7 6 9 5 11 C4 9 0 7 0 3 Z"/>
    <path id="orbit" d="M 575 162 A 125 40 0 0 0 825 162 A 125 40 0 0 0 575 162"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <circle cx="120" cy="30" r="90" fill="#FAD4DF" opacity="0.6" filter="url(#soft)"/>
    <circle cx="830" cy="250" r="100" fill="#DCD5F5" opacity="0.7" filter="url(#soft)"/>
    <circle cx="470" cy="270" r="60" fill="#FFE3CC" opacity="0.6" filter="url(#soft)"/>

    <!-- fluffy clouds -->
    <g fill="#FFFFFF" opacity="0.85">
      <g>
        <circle cx="430" cy="52" r="14"/><circle cx="448" cy="44" r="18"/><circle cx="468" cy="52" r="14"/>
        <rect x="428" y="52" width="42" height="12" rx="6"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="560" cy="236" r="11"/><circle cx="574" cy="229" r="15"/><circle cx="590" cy="236" r="11"/>
        <rect x="558" y="236" width="34" height="10" rx="5"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -10 0; 0 0" dur="11s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- name sticker -->
  <g font-family="'Arial Rounded MT Bold','Varela Round','Quicksand','Nunito','Segoe UI',sans-serif">
    <text x="68" y="124" font-size="58" font-weight="700" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round">Sohee An</text>
    <text x="68" y="124" font-size="58" font-weight="700" fill="#7A5C58">Sohee An</text>
    <text x="72" y="166" font-size="21" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">one photo, every angle</text>
    <text x="72" y="166" font-size="21" fill="#E28BA5">one photo, every angle</text>
    <text x="72" y="202" font-size="15" fill="#A88E8E">novel view synthesis  ♡  3d vision</text>
  </g>

  <!-- floating hearts -->
  <g fill="#F7B6C8">
    <use href="#heart" transform="translate(396 70) scale(1.3)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </use>
    <g transform="translate(395 175)">
      <use href="#heart" transform="scale(0.9)"/>
      <animateTransform attributeName="transform" type="translate" values="395 175; 395 165; 395 175" dur="3.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(850 60)">
      <use href="#heart" fill="#CDBDF0"/>
      <animateTransform attributeName="transform" type="translate" values="850 60; 850 50; 850 60" dur="2.9s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(610 70)">
      <use href="#heart" transform="scale(0.8)" fill="#FFC9A8"/>
      <animateTransform attributeName="transform" type="translate" values="610 70; 610 62; 610 70" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- dotted orbit -->
  <use href="#orbit" fill="none" stroke="#F3C6D3" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 11"/>

  <!-- mochi (squishy) -->
  <ellipse cx="700" cy="191" rx="54" ry="7" fill="#E7D3EA" opacity="0.7">
    <animate attributeName="rx" values="54;58;54" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <g transform="translate(700 188)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 0.94; 1 1"
        dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <g transform="translate(-700 -188)">
        <!-- sprout -->
        <path d="M700 112 Q 698 102 701 94" fill="none" stroke="#8CC084" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="692" cy="94" rx="8" ry="4.5" fill="#A8D5A2" transform="rotate(-25 692 94)"/>
        <ellipse cx="709" cy="92" rx="8" ry="4.5" fill="#B9E0B2" transform="rotate(25 709 92)"/>
        <!-- body -->
        <path d="M 648 188 C 640 150 668 110 700 110 C 732 110 760 150 752 188 Q 700 196 648 188 Z"
              fill="#FFFDF9" stroke="#EBCFC2" stroke-width="2.5"/>
        <!-- face follows the camera -->
        <g>
          <ellipse cx="676" cy="164" rx="8.5" ry="4.5" fill="#F9B9C9" opacity="0.85"/>
          <ellipse cx="724" cy="164" rx="8.5" ry="4.5" fill="#F9B9C9" opacity="0.85"/>
          <ellipse cx="687" cy="151" rx="4.5" ry="4.8" fill="#5A4644">
            <animate attributeName="ry" values="4.8;4.8;0.6;4.8" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="713" cy="151" rx="4.5" ry="4.8" fill="#5A4644">
            <animate attributeName="ry" values="4.8;4.8;0.6;4.8" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
          </ellipse>
          <path d="M 693 161 q 3.5 4 7 0 q 3.5 4 7 0" fill="none" stroke="#C9707F" stroke-width="2" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="translate"
            values="-8 1; 0 4; 8 1; 0 -2; -8 1" dur="6s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>

  <!-- speech bubble -->
  <g opacity="0" font-family="'Arial Rounded MT Bold','Varela Round','Quicksand','Nunito','Segoe UI',sans-serif">
    <rect x="752" y="78" width="96" height="30" rx="15" fill="#FFFFFF" stroke="#F3C6D3" stroke-width="2"/>
    <path d="M 764 106 L 754 118 L 774 107 Z" fill="#FFFFFF" stroke="#F3C6D3" stroke-width="2" stroke-linejoin="round"/>
    <rect x="757" y="102" width="20" height="5" fill="#FFFFFF"/>
    <text x="800" y="98" font-size="14" fill="#E28BA5" text-anchor="middle">cheese~!</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.2;0.36;0.42;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- camera travelling the orbit -->
  <g>
    <g transform="translate(-16 -12)">
      <rect x="0" y="5" width="32" height="21" rx="8" fill="#F7B6C8" stroke="#E28BA5" stroke-width="2"/>
      <rect x="9" y="0" width="12" height="7" rx="3" fill="#F7B6C8" stroke="#E28BA5" stroke-width="2"/>
      <circle cx="16" cy="15.5" r="6.5" fill="#FFFFFF" stroke="#E28BA5" stroke-width="1.5"/>
      <circle cx="16" cy="15.5" r="3" fill="#7A5C58"/>
      <circle cx="26" cy="10" r="1.6" fill="#FFFFFF"/>
    </g>
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0.35;0.35;1" keyTimes="0;0.45;0.55;0.95;1" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
